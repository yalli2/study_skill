name: Android 앱 빌드

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 웹 파일 빌드 + 동기화
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: 서명 키 복원 (Secrets가 있을 때만)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          fi
      - name: APK(테스트용) + AAB(Play 스토어용) 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: study-skill-quest-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
